[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sshtik"
version = "0.2.3"
description = "SSH terminal with pop-up SFTP and MySQL/MariaDB helpers that ride on the live session"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# GTK, VTE and paramiko come from the distro (see README); they are deliberately
# not pip dependencies so that `pipx install --system-site-packages` needs no compiler.
dependencies = []
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://sshtik.com"
Repository = "https://github.com/xsDevelopments/sshtik"

[project.scripts]
sshtik = "sshtik.app:main"

[tool.setuptools.packages.find]
include = ["sshtik*"]
