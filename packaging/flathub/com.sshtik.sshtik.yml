# Flathub submission manifest. Identical to ../com.sshtik.sshtik.yml except the
# app source is a pinned git tag. Copy this file + python-deps.json into the
# flathub/flathub PR (see ../README.md).
app-id: com.sshtik.sshtik
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sshtik
finish-args:
  - --share=ipc
  - --share=network            # SSH
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home          # local pane of the file panel, ~/.ssh, editors
  - --socket=ssh-auth          # ssh-agent
  - --talk-name=org.freedesktop.Flatpak   # run the host's mysql/mysqldump for the local DB pane
modules:
  # --- build deps for VTE that the GNOME SDK does not carry -----------------
  - name: simdutf
    buildsystem: cmake-ninja
    config-opts:
      - -DSIMDUTF_TESTS=OFF
      - -DSIMDUTF_TOOLS=OFF
      - -DSIMDUTF_BENCHMARKS=OFF
      - -DBUILD_SHARED_LIBS=ON
    cleanup: [/include, /lib/pkgconfig, /lib/cmake]
    sources:
      - type: archive
        url: https://github.com/simdutf/simdutf/archive/refs/tags/v9.1.2.tar.gz
        sha256: 0992cd1bcddee10424e49d6bc3ff8da02f9abc4c48033cbb1b0b41b62c727d33
  - name: fmt
    buildsystem: cmake-ninja
    config-opts:
      - -DFMT_TEST=OFF
      - -DFMT_DOC=OFF
      - -DBUILD_SHARED_LIBS=ON
    cleanup: ['*']   # VTE uses fmt header-only; nothing needed at runtime
    sources:
      - type: archive
        url: https://github.com/fmtlib/fmt/archive/refs/tags/12.2.0.tar.gz
        sha256: 8b852bb5aa6e7d8564f9e81394055395dd1d1936d38dfd3a17792a02bebd7af0
  - name: fast_float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
      - -DFASTFLOAT_SANITIZE=OFF
    cleanup: ['*']   # header-only
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  # The GNOME runtime ships VTE for GTK 4 only; build the GTK 3 flavour ourselves.
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=true
      - -Dgtk4=false
      - -Dvapi=false
      - -Ddocs=false
      - -Dglade=false
      - -D_systemd=false
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/vala
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.84.1/vte-0.84.1.tar.gz
        sha256: 9f73468982a339cd1eb942beb7d348a5564c9ed48473ad1690c791f8474916ec
  - python-deps.json
  - name: sshtik
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/com.sshtik.sshtik.desktop ${FLATPAK_DEST}/share/applications/com.sshtik.sshtik.desktop
      - install -Dm644 data/com.sshtik.sshtik.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.sshtik.sshtik.metainfo.xml
      - install -Dm644 data/com.sshtik.sshtik.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.sshtik.sshtik.svg
    sources:
      - type: git
        url: https://github.com/xsDevelopments/sshtik.git
        tag: v0.2.0
        commit: 49122454c36436e49e459deb535e59064ab2ccb3
